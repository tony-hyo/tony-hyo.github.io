<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tony &amp; Hyo · Save the Date</title>
  <meta name="description" content="Tony and Hyo are getting married on April 11, 2027 in Seoul. Save the date.">
  <meta name="theme-color" content="#EDE7DB">

  <!-- Link previews. Update the two absolute URLs after the first deploy. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tony &amp; Hyo are getting married">
  <meta property="og:description" content="Save the date · Sunday, April 11, 2027 · Seoul, Korea">
  <meta property="og:image" content="https://tony-hyo.github.io/assets/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://tony-hyo.github.io/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Bellefair&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-closed">

  <!-- Shared SVG shapes. Referenced by id from this document only. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="petal-grad-a" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FBE6EC"/>
        <stop offset="0.55" stop-color="#F6C7D5"/>
        <stop offset="1" stop-color="#EC9DB8"/>
      </linearGradient>
      <linearGradient id="petal-grad-b" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F9D9E3"/>
        <stop offset="0.55" stop-color="#F0B0C5"/>
        <stop offset="1" stop-color="#E27FA2"/>
      </linearGradient>
    </defs>
    <!-- Sakura petal: narrow base at the bottom, notched tip at the top. -->
    <symbol id="petal-a" viewBox="0 0 20 24">
      <path d="M10 23C3.5 18 .5 11 2.5 5.5 3.8 2 6.8 1 8.2 3.6 9 5 9.6 6.2 10 7.4 10.4 6.2 11 5 11.8 3.6 13.2 1 16.2 2 17.5 5.5 19.5 11 16.5 18 10 23Z" fill="url(#petal-grad-a)"/>
      <path d="M10 22C9.4 16 9.4 11 10 7.6" fill="none" stroke="#E27AA0" stroke-width=".5" opacity=".45"/>
    </symbol>
    <symbol id="petal-b" viewBox="0 0 20 24">
      <path d="M10 23C3.5 18 .5 11 2.5 5.5 3.8 2 6.8 1 8.2 3.6 9 5 9.6 6.2 10 7.4 10.4 6.2 11 5 11.8 3.6 13.2 1 16.2 2 17.5 5.5 19.5 11 16.5 18 10 23Z" fill="url(#petal-grad-b)"/>
      <path d="M10 22C9.4 16 9.4 11 10 7.6" fill="none" stroke="#C9587F" stroke-width=".5" opacity=".45"/>
    </symbol>
  </svg>

  <div class="petals" aria-hidden="true"></div>

  <main>
    <section class="hero">

      <div class="envelope-scene">
        <button class="envelope" type="button" aria-label="Open invitation">
          <span class="env-back"></span>
          <span class="card-mini" aria-hidden="true">
            <picture class="art">
              <source srcset="assets/blossoms.webp" type="image/webp">
              <img src="assets/blossoms.png" alt="" width="1000" height="1400">
            </picture>
            <span class="mini-text">
              <span class="mini-word">Save</span>
              <span class="mini-the">the</span>
              <span class="mini-word">Date</span>
              <span class="mini-date">04.11.27</span>
            </span>
          </span>
          <span class="env-side env-side-l"></span>
          <span class="env-side env-side-r"></span>
          <span class="env-shadow env-bottom-shadow"><span class="env-blur"></span></span>
          <span class="env-bottom"></span>
          <span class="env-shadow env-flap-shadow"><span class="env-blur"></span></span>
          <span class="env-flap"></span>
          <span class="env-seal">
            <picture>
              <source srcset="assets/seal-v3.webp" type="image/webp">
              <img src="assets/seal-v3.png" alt="" width="320" height="320">
            </picture>
          </span>
          <span class="env-address" aria-hidden="true">
            <span class="env-to">To</span>
            <span class="env-name" data-guest>Friends &amp; Family</span>
          </span>
        </button>
        <p class="tap-hint">Tap to open</p>
      </div>

      <article class="card">
        <picture class="art">
          <source srcset="assets/blossoms.webp" type="image/webp">
          <img src="assets/blossoms.png" alt="" width="1000" height="1400">
        </picture>

        <div class="text">
          <h1 class="headline">
            <span class="word">Save</span>
            <span class="the">the</span>
            <span class="word">Date</span>
          </h1>
          <p class="caps names">Tony and Hyo are getting married</p>
          <p class="date-big">04.11.27</p>
          <p class="caps venue">Ramada by Wyndham Seoul Sindorim<br>Sky Garden Hall (14F)<br>Seoul, South Korea</p>
          <p class="script-line closing">Celebration<br>to follow</p>
        </div>
      </article>

      <a class="scroll-hint" href="#details" aria-label="Scroll to details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </section>

    <section class="details" id="details">
      <p class="script-line">Join us</p>

      <div class="countdown" data-countdown></div>

      <a class="btn btn-primary" data-rsvp href="#">RSVP &amp; Details</a>

      <p class="script-line closing">With love, Tony &amp; Hyo</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/invite-logic.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
